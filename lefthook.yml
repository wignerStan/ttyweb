version: 1
pre-commit:
  parallel: true
  commands:
    go-vet:
      tags: [go]
      run: . scripts/strip-git-env.sh && go vet ./...
    golangci-lint:
      tags: [go]
      run: . scripts/strip-git-env.sh && golangci-lint run ./...
    go-test-unit:
      tags: [go, test]
      run: . scripts/strip-git-env.sh && go test ./... -count=1 -short
    biome-check:
      tags: [frontend]
      run: cd frontend && bun run lint
    tsc:
      tags: [frontend]
      run: cd frontend && bun run typecheck
    vitest:
      tags: [frontend, test]
      run: cd frontend && bunx vitest run
pre-push:
  commands:
    go-test-race:
      tags: [go, test]
      run: . scripts/strip-git-env.sh && go test ./... -race -count=1
    go-coverage-gate:
      tags: [go, coverage]
      run: |
        . scripts/strip-git-env.sh
        go test ./... -coverprofile=cover.out -count=1
        # Exclude CLI entry point (needs full server) and Xunfei speech (needs external API)
        grep -v "main.go:" cover.out | grep -v "ws_speech.go:" > cover_filtered.out
        COVERAGE=$(go tool cover -func=cover_filtered.out | grep total | awk '{print $3}' | tr -d '%')
        echo "Go coverage (excl main/speech): ${COVERAGE}%"
        if awk "BEGIN {exit !($COVERAGE < 90)}"; then
          echo "FAIL: coverage ${COVERAGE}% < 90%"
          exit 1
        fi
        rm -f cover.out cover_filtered.out
