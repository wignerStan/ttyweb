version: 1
pre-commit:
  parallel: true
  commands:
    go-vet:
      tags: [go]
      run: go vet ./...
    golangci-lint:
      tags: [go]
      run: golangci-lint run ./...
    go-test-unit:
      tags: [go, test]
      run: go test ./... -count=1 -short
    biome-check:
      tags: [frontend]
      run: cd frontend && bunx biome check src/
    tsc:
      tags: [frontend]
      run: cd frontend && bunx tsc --noEmit
    vitest:
      tags: [frontend, test]
      run: cd frontend && bunx vitest run
pre-push:
  commands:
    go-test-race:
      tags: [go, test]
      run: go test ./... -race -count=1
    go-coverage-gate:
      tags: [go, coverage]
      run: |
        go test ./... -coverprofile=cover.out -count=1
        COVERAGE=$(go tool cover -func=cover.out | grep total | awk '{print $3}' | tr -d '%')
        echo "Go coverage: ${COVERAGE}%"
        if awk "BEGIN {exit !($COVERAGE < 90)}"; then
          echo "FAIL: coverage ${COVERAGE}% < 90%"
          exit 1
        fi
        rm -f cover.out
