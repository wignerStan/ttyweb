name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: go-mod-
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.0

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('frontend/bun.lockb') }}
          restore-keys: bun-
      - run: cd frontend && bun install
      - run: cd frontend && bunx biome check src/
      - run: cd frontend && bunx tsc --noEmit

  test-go:
    runs-on: ubuntu-latest
    needs: [lint-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: go-mod-
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
      - run: go test ./... -race -count=1 -coverprofile=coverage.out
      - name: Coverage gate
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Go coverage: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 80)}"; then
            echo "::error::Go coverage ${COVERAGE}% below 80%"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('frontend/bun.lockb') }}
          restore-keys: bun-
      - run: cd frontend && bun install
      - run: cd frontend && bunx vitest run --coverage.enabled
      - name: Build verification
        run: cd frontend && bun run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  test-e2e:
    runs-on: ubuntu-latest
    needs: [test-go, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
      - uses: oven-sh/setup-bun@v2
      - run: go build -o ttyweb .
      - run: cd frontend && bun install
      - run: cd frontend && bunx playwright install --with-deps chromium
      - name: E2E burn-in (3x)
        run: |
          for i in 1 2 3; do
            echo "=== E2E iteration $i/3 ==="
            cd frontend && bunx playwright test || exit 1
          done
