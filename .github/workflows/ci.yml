name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: go-mod-
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('frontend/bun.lockb') }}
          restore-keys: bun-
      - run: cd frontend && bun install
      - run: cd frontend && bun run lint
      - run: cd frontend && bun run typecheck
      # Security: check for known vulnerabilities in frontend dependencies
      - name: Audit frontend dependencies
        run: cd frontend && bunx npm-audit --production 2>/dev/null || true

  test-go:
    runs-on: ubuntu-latest
    needs: [lint-go]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: go-mod-
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      # Security: check for known vulnerabilities in Go dependencies
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Go vulnerability check
        run: govulncheck ./...
      - run: go test ./... -race -count=1 -coverprofile=coverage.out
      - name: Coverage gate
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Go coverage: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 90)}"; then
            echo "::error::Go coverage ${COVERAGE}% below 90%"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('frontend/bun.lockb') }}
          restore-keys: bun-
      - run: cd frontend && bun install
      - run: cd frontend && bunx vitest run --coverage.enabled
      - name: Build verification
        run: cd frontend && bun run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  test-e2e:
    runs-on: ubuntu-latest
    needs: [test-go, test-frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'
      - run: go build -o ttyweb .
      - run: cd frontend && bun install
      - run: cd frontend && bunx playwright install --with-deps chromium
      - name: E2E burn-in (3x)
        run: |
          for i in 1 2 3; do
            echo "=== E2E iteration $i/3 ==="
            cd frontend && bunx playwright test || exit 1
          done
      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 30
