paths:
  /auth/check:
    get:
      description: Returns whether basic auth is enabled and if the client is authenticated
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Check auth status
      tags:
      - auth
  /profiles:
    get:
      consumes:
      - application/json
      description: |-
        Returns all saved profiles
        Creates a new profile
      parameters:
      - description: Profile data
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.Profile'
      summary: Create profile
      tags:
      - profiles
      - profiles
    post:
      consumes:
      - application/json
      description: |-
        Returns all saved profiles
        Creates a new profile
      parameters:
      - description: Profile data
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.Profile'
